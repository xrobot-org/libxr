# OpenOCD through the simulated CMSIS-DAP v2 probe (dap_sim_usbip --mode=v2-jtag)
# to the simulated JTAG target.
adapter driver cmsis-dap
cmsis-dap backend usb_bulk
cmsis-dap vid_pid 0x1209 0x0002
adapter serial 0002
transport select jtag
adapter speed 1000
jtag newtap sim cpu -irlen 4 -expected-id 0x4ba00477
dap create sim.dap -chain-position sim.cpu
target create sim.cpu cortex_m -dap sim.dap
