# OpenOCD against the simulated SWD target (swd_target_bitbang) over remote_bitbang.
adapter driver remote_bitbang
remote_bitbang host 127.0.0.1
remote_bitbang port 44853
transport select swd
swd newdap sim cpu -enable
dap create sim.dap -chain-position sim.cpu
target create sim.cpu cortex_m -dap sim.dap
# The model executes no instructions: once halted, run "sim.cpu cortex_m maskisr on" so
# that step uses C_STEP instead of a temporary breakpoint and a run.
