// Keil uVision debug initialization script for the simulated CMSIS-DAP probe
// (dap_sim_usbip, attached on Windows with usbip-win2) and the simulated SWD target.
// Use it as the debug "Initialization File" of a generic ARMCM4 project with the
// CMSIS-DAP debugger, -X"0002" as the probe serial, no flash algorithm, "Load
// Application at Startup" and "Update Target before Debugging" off, then run
// `UV4.exe -d <project>`; the log lands in keil_sim.log next to the project.
// Never run it while a real CMSIS-DAP probe is attached: Keil falls back to the first
// probe it finds when the serial does not match.
FUNC void sim(void) {
  unsigned long i, bad;
  printf("CPUID %x\n", _RDWORD(0xE000ED00));
  printf("DBGMCU %x\n", _RDWORD(0xE0042000));
  bad = 0;
  for (i = 0; i < 0x1000; i += 4) { _WDWORD(0x20001000 + i, 0x5A000000 + i); }
  for (i = 0; i < 0x1000; i += 4) { if (_RDWORD(0x20001000 + i) != 0x5A000000 + i) { bad++; } }
  printf("RAM_RW_MISMATCH %d\n", bad);
  _WBYTE(0x20003001, 0xAB);
  _WWORD(0x20003002, 0xCDEF);
  printf("BYTE_LANES %x\n", _RDWORD(0x20003000));
  R3 = 0x55AA55AA;
  printf("R3 %x\n", R3);
}
LOG > keil_sim.log
printf("KEIL_START\n");
sim();
printf("KEIL_DONE\n");
LOG OFF
exit
