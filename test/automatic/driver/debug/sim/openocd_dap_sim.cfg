# OpenOCD through the simulated CMSIS-DAP v2 probe (dap_sim_usbip over USB/IP) to the
# simulated SWD target. 经仿真的 CMSIS-DAP v2 探针（dap_sim_usbip，USB/IP）连 SWD 目标仿真。
#
# The host may carry real CMSIS-DAP probes: the probe is selected by VID:PID, serial string
# and USB bus-port location together, and the file refuses to load without the last two.
# Set them before the file: -c "set SIM_SERIAL <serial>" -c "set SIM_LOCATION <bus-port>"
# (dap_e2e.sh reads them from the device under vhci). OpenOCD 0.12.0+dev-02421 ignores
# the location for this backend, so the caller also makes sure that VID:PID is unique on
# the host and lies under vhci before starting it.
# 主机上可能有真实的 CMSIS-DAP 探针：探针同时按 VID:PID、序列号和 USB 总线端口位置选择，
# 没有后两者时本文件拒绝加载。在本文件之前设置：-c "set SIM_SERIAL <序列号>"
# -c "set SIM_LOCATION <总线-端口>"（dap_e2e.sh 从 vhci 下的设备读出）。OpenOCD
# 0.12.0+dev-02421 对这个后端忽略位置，所以调用者启动前还要确认该 VID:PID 在主机上唯一
# 且在 vhci 之下。
if {![info exists SIM_SERIAL] || ![info exists SIM_LOCATION]} {
    error "SIM_SERIAL and SIM_LOCATION must be set before this file"
}
adapter driver cmsis-dap
cmsis-dap backend usb_bulk
cmsis-dap vid_pid 0x1209 0x0002
adapter serial $SIM_SERIAL
adapter usb location $SIM_LOCATION
transport select swd
adapter speed 1000
swd newdap sim cpu -enable
dap create sim.dap -chain-position sim.cpu
target create sim.cpu cortex_m -dap sim.dap
